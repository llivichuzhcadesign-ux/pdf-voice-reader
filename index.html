<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Orbit" />
  <title>Orbit</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    @media (max-width: 700px) {
      body[data-mobile-view="library"] #library {
        height: calc(100vh - 96px - env(safe-area-inset-bottom));
        border-bottom: 0;
      }

      body[data-mobile-view="library"] main {
        display: none;
      }

      body[data-mobile-view="reader"] main {
        display: flex;
      }

      body[data-reader-pane="text"] .pdfPreview,
      body[data-reader-pane="pdf"] .textReader {
        display: none;
      }

      body[data-reader-pane="text"] .textReader,
      body[data-reader-pane="pdf"] .pdfPreview {
        display: block;
        min-height: 100%;
      }

      body[data-reader-pane="pdf"] .pdfEmbed {
        height: calc(100vh - 210px - env(safe-area-inset-bottom));
        min-height: 58vh;
      }

      body[data-reader-pane="pdf"] #mobileInvertBtn {
        display: inline-grid;
      }
    }
  </style>
</head>
<body data-mobile-view="library" data-reader-pane="text" data-playback="idle">
  <aside id="library" aria-label="Saved PDF library">
    <h1>Orbit</h1>
    <p class="intro">eyes-free.</p>
    <label class="upload">Add PDF<input id="fileInput" type="file" accept="application/pdf" multiple hidden></label>
    <div class="urlBox" aria-label="Open online PDF">
      <label for="pdfUrlInput">Open PDF link</label>
      <input id="pdfUrlInput" type="url" inputmode="url" autocomplete="off" autocapitalize="none" placeholder="https://example.com/file.pdf" />
      <button id="openUrlBtn" type="button">Open & Save Link</button>
      <p class="miniNote">If a site blocks direct opening, download the PDF and use Add PDF.</p>
    </div>
    <div id="installBox" class="installBox">
      <strong>iPhone install</strong>
      <span>Safari → Share → Add to Home Screen.</span>
    </div>
    <div id="status" aria-live="polite"></div>
    <h2>Saved PDFs</h2>
    <div id="pdfList"></div>
  </aside>

  <main>
    <header id="toolbar" aria-label="Reader controls">
      <div class="mobileTopLine">
        <div>
          <strong>Read, Pause, Mark.</strong>
          <span id="mobileDocTitle">No PDF selected</span>
        </div>
        <div class="mobileReaderTools" aria-label="Reader view controls">
          <div class="paneSwitch" role="group" aria-label="Reader view">
            <button id="mobileTextViewBtn" type="button" class="active" aria-pressed="true">Text</button>
            <button id="mobilePdfViewBtn" type="button" aria-pressed="false">PDF</button>
          </div>
          <button id="mobileInvertBtn" class="smallBtn invertIconBtn" type="button" aria-label="Invert PDF" title="Invert PDF"><span aria-hidden="true">Invert</span></button>
          <button id="mobileSettingsBtn" class="smallBtn iconBtn" type="button" aria-label="Settings" title="Settings" aria-expanded="false"><span class="settingsIcon" aria-hidden="true"></span></button>
        </div>
      </div>

      <div class="controlGroup primaryControls">
        <button id="playBtn">Read</button>
        <button id="pauseBtn">Pause</button>
        <button id="continueBtn">Continue</button>
        <button id="stopBtn">Stop</button>
        <button id="resumeBtn">Resume</button>
        <button id="invertBtn" class="toggle" aria-pressed="false">Invert PDF: Off</button>
      </div>

      <div class="controlGroup flowControls" aria-label="Voice flow controls">
        <label>Style
          <select id="styleSelect">
            <option value="smooth">Smooth</option>
            <option value="podcast">Podcast</option>
            <option value="study">Study</option>
            <option value="exact">Exact</option>
          </select>
        </label>
        <label>Preset
          <select id="presetSelect">
            <option value="podcast">Podcast</option>
            <option value="clear">Clear</option>
            <option value="soft">Soft</option>
            <option value="slowStudy">Slow Study</option>
          </select>
        </label>
        <label class="browserOnly">Voice <select id="voiceSelect"></select></label>
        <label>Speed <input id="rate" type="range" min="0.65" max="1.35" step="0.05" value="0.92"><span id="rateValue">0.92</span></label>
        <label>Pitch <input id="pitch" type="range" min="0.75" max="1.25" step="0.05" value="1"><span id="pitchValue">1.00</span></label>
        <button id="advancedToggle" class="smallBtn" aria-expanded="false">Flow settings</button>
      </div>

      <div id="advancedControls" class="advancedControls" hidden>
        <label>Sentence pause <input id="sentencePause" type="range" min="0" max="1400" step="50" value="450"><span id="sentencePauseValue">450ms</span></label>
        <label>Paragraph pause <input id="paragraphPause" type="range" min="0" max="2200" step="50" value="900"><span id="paragraphPauseValue">900ms</span></label>
        <label>Heading pause <input id="headingPause" type="range" min="0" max="2600" step="50" value="1200"><span id="headingPauseValue">1200ms</span></label>
      </div>

      <span id="docTitle">No PDF selected</span>
    </header>
    <section id="viewer">
      <div class="empty welcome">
        <strong>Orbit</strong><br>
        Add a PDF or open a PDF link. Your library and progress stay on this device.
      </div>
    </section>
  </main>

  <nav id="mobileDock" class="mobileDock" aria-label="Orbit mobile navigation">
    <button id="dockLibrary" type="button" class="dockButton active" aria-label="Library" aria-pressed="true">
      <span class="dockIcon dockLibraryIcon" aria-hidden="true"></span>
      <span>Library</span>
    </button>
    <button id="dockReader" type="button" class="dockButton" aria-label="Reader" aria-pressed="false">
      <span class="dockIcon dockReaderIcon" aria-hidden="true"></span>
      <span>Reader</span>
    </button>
    <button id="dockReadPause" type="button" class="dockButton dockPrimary dockReadPause" aria-label="Read" aria-pressed="false">
      <span class="dockMorphIcon" aria-hidden="true"><span></span><span></span></span>
      <span class="dockReadPauseLabel">Read</span>
    </button>
    <button id="dockMark" type="button" class="dockButton dockMark" aria-label="Mark" disabled>
      <span class="dockIcon dockDotIcon" aria-hidden="true"></span>
      <span>Mark</span>
    </button>
  </nav>

  <script type="module" src="app.js"></script>
  <script>
    function orbitSetMobileView(view) {
      document.body.dataset.mobileView = view === 'reader' ? 'reader' : 'library';
      document.body.classList.remove('settingsOpen');
      const libraryActive = document.body.dataset.mobileView === 'library';
      document.getElementById('dockLibrary')?.classList.toggle('active', libraryActive);
      document.getElementById('dockReader')?.classList.toggle('active', !libraryActive);
      document.getElementById('dockLibrary')?.setAttribute('aria-pressed', String(libraryActive));
      document.getElementById('dockReader')?.setAttribute('aria-pressed', String(!libraryActive));
    }

    function orbitSetReaderPane(pane) {
      const nextPane = pane === 'pdf' ? 'pdf' : 'text';
      document.body.dataset.readerPane = nextPane;
      const textActive = nextPane === 'text';
      document.getElementById('mobileTextViewBtn')?.classList.toggle('active', textActive);
      document.getElementById('mobilePdfViewBtn')?.classList.toggle('active', !textActive);
      document.getElementById('mobileTextViewBtn')?.setAttribute('aria-pressed', String(textActive));
      document.getElementById('mobilePdfViewBtn')?.setAttribute('aria-pressed', String(!textActive));
    }

    function orbitSetPlayback(state) {
      const nextState = state === 'playing' || state === 'paused' ? state : 'idle';
      document.body.dataset.playback = nextState;
      const button = document.getElementById('dockReadPause');
      const label = button?.querySelector('.dockReadPauseLabel');
      const isPlaying = nextState === 'playing';
      if (button) {
        button.setAttribute('aria-label', isPlaying ? 'Pause' : 'Read');
        button.setAttribute('aria-pressed', String(isPlaying));
      }
      if (label) label.textContent = isPlaying ? 'Pause' : 'Read';
    }

    function orbitRefreshPlayback() {
      if (speechSynthesis.paused) orbitSetPlayback('paused');
      else if (speechSynthesis.speaking) orbitSetPlayback('playing');
      else if (document.body.dataset.playback !== 'idle') orbitSetPlayback('idle');
    }

    document.getElementById('dockLibrary')?.addEventListener('click', () => orbitSetMobileView('library'));
    document.getElementById('dockReader')?.addEventListener('click', () => orbitSetMobileView('reader'));
    document.getElementById('dockReadPause')?.addEventListener('click', () => {
      orbitSetMobileView('reader');
      if (document.body.dataset.playback === 'playing') {
        document.getElementById('pauseBtn')?.click();
        orbitSetPlayback('paused');
        return;
      }
      if (document.body.dataset.playback === 'paused') {
        document.getElementById('continueBtn')?.click();
        orbitSetPlayback('playing');
        return;
      }
      document.getElementById('playBtn')?.click();
      orbitSetPlayback('playing');
    });
    document.getElementById('mobileTextViewBtn')?.addEventListener('click', () => orbitSetReaderPane('text'));
    document.getElementById('mobilePdfViewBtn')?.addEventListener('click', () => orbitSetReaderPane('pdf'));
    document.getElementById('mobileInvertBtn')?.addEventListener('click', () => document.getElementById('invertBtn')?.click());
    document.getElementById('mobileSettingsBtn')?.addEventListener('click', () => {
      document.body.classList.toggle('settingsOpen');
      document.getElementById('mobileSettingsBtn')?.setAttribute('aria-expanded', String(document.body.classList.contains('settingsOpen')));
    });
    document.addEventListener('click', event => {
      if (event.target.closest('.pdfItem')) {
        orbitSetReaderPane('text');
        setTimeout(() => orbitSetMobileView('reader'), 0);
      }
    });
    setInterval(orbitRefreshPlayback, 700);
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }
  </script>
</body>
</html>
